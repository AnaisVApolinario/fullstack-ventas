services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ventas
      POSTGRES_PASSWORD: ventas
      POSTGRES_DB: ventas
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ventas"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/ventas
      DB_USER: ventas
      DB_PASSWORD: ventas
      JWT_SECRET: ${JWT_SECRET:-cambia-este-secreto-por-uno-largo-de-al-menos-32-caracteres}
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080/api
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
